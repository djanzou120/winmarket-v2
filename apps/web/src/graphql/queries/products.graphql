query Categories($filter: CategoryFilter, $pagination: PaginationInput) {
  categories(filter: $filter, pagination: $pagination) {
    edges {
      node {
        id
        name
        slug
        description
        imageUrl
        isActive
        productCount
        parent {
          id
          name
          slug
        }
        children {
          id
          name
          slug
          productCount
        }
      }
    }
    totalCount
  }
}

