query Products($filter: ProductFilter, $pagination: PaginationInput) {
  products(filter: $filter, pagination: $pagination) {
    edges {
      node {
        id
        title
        slug
        shortDescription
        price
        originalPrice
        condition
        status
        stock
        images
        isDigital
        shippingRequired
        averageRating
        reviewCount
        soldCount
        favoriteCount
        viewCount
        seller {
          id
          firstName
          lastName
          avatar
        }
        category {
          id
          name
          slug
        }
        createdAt
        publishedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query Product($id: ID!) {
  product(id: $id) {
    id
    title
    slug
    description
    shortDescription
    price
    originalPrice
    condition
    status
    stock
    minOrderQuantity
    maxOrderQuantity
    weight
    dimensions
    sku
    tags
    images
    isDigital
    shippingRequired
    allowReviews
    averageRating
    reviewCount
    soldCount
    favoriteCount
    viewCount
    seller {
      id
      firstName
      lastName
      avatar
      profile {
        bio
        address
        city
        country
      }
    }
    category {
      id
      name
      slug
      parent {
        id
        name
        slug
      }
    }
    variants {
      id
      name
      value
      price
      stock
      sku
      image
      isActive
    }
    createdAt
    updatedAt
    publishedAt
  }
}

