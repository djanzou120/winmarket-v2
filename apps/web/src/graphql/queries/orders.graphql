query MyOrders($pagination: PaginationInput) {
  myOrders(pagination: $pagination) {
    edges {
      node {
        id
        orderNumber
        status
        paymentStatus
        paymentMethod
        subtotal
        taxAmount
        shippingAmount
        discountAmount
        totalAmount
        currency
        itemCount
        seller {
          id
          firstName
          lastName
          avatar
        }
        items {
          id
          productName
          productImage
          productSku
          unitPrice
          quantity
          totalPrice
          variantName
          variantValue
        }
        shippingAddress {
          street
          city
          state
          postalCode
          country
          phone
          name
        }
        trackingNumber
        estimatedDelivery
        actualDelivery
        createdAt
        updatedAt
        confirmedAt
        shippedAt
        deliveredAt
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

