version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: winmarket-postgres
    environment:
      POSTGRES_DB: winmarket_v2
      POSTGRES_USER: winmarket
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winmarket -d winmarket_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: winmarket-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: winmarket-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development database admin tools
  pgadmin:
    image: dpage/pgadmin4
    container_name: winmarket-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@winmarket.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles: ["tools"]

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: winmarket-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles: ["tools"]

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: winmarket-network