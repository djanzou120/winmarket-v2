name: Mobile CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  # Mobile app build and test
  mobile-ci:
    name: Mobile CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Expo CLI
      run: bun install -g @expo/cli

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          **/node_modules
        key: ${{ runner.os }}-mobile-bun-${{ hashFiles('**/package.json', '**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-mobile-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type check mobile app
      run: |
        cd apps/mobile
        bun run type-check

    - name: Lint mobile app
      run: |
        cd apps/mobile
        bun run lint

  # Build for EAS (Expo Application Services)
  build-mobile:
    name: Build Mobile App
    runs-on: ubuntu-latest
    needs: mobile-ci
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Expo CLI and EAS CLI
      run: |
        bun install -g @expo/cli eas-cli

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          **/node_modules
        key: ${{ runner.os }}-mobile-bun-${{ hashFiles('**/package.json', '**/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-mobile-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: EAS Build (Preview)
      if: github.ref == 'refs/heads/develop'
      run: |
        cd apps/mobile
        eas build --platform all --profile preview --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    - name: EAS Build (Production)
      if: github.ref == 'refs/heads/main'
      run: |
        cd apps/mobile
        eas build --platform all --profile production --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Submit to app stores
  submit-mobile:
    name: Submit to App Stores
    runs-on: ubuntu-latest
    needs: build-mobile
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup EAS CLI
      run: bun install -g eas-cli

    - name: Submit to App Store and Google Play
      run: |
        cd apps/mobile
        eas submit --platform all --latest --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}